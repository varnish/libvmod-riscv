name: Ubuntu Linux 24.04

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ubuntu-24.04
  cancel-in-progress: true

jobs:
  native:
    name: Ubuntu Linux 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Varnish Cache 9.1
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://keys.openpgp.org/vks/v1/by-fingerprint/694566269779DFAC975ED9BDD0525EAE838B3344 \
            | sudo gpg --dearmor -o /etc/apt/keyrings/varnish.gpg
          echo "deb [signed-by=/etc/apt/keyrings/varnish.gpg] https://packages.varnish-software.com/varnish/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/varnish.list
          sudo apt-get update
          sudo apt-get install -y varnish varnish-dev

      - name: Install Dependencies
        run: |
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            cmake \
            ninja-build \
            libssl-dev \
            libjemalloc-dev \
            python3 \
            pkg-config \
            ccache

      - name: '🚧 CCache setup'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-linux-24.04
          max-size: 200M

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build RISC-V programs
        run: program/build.sh

      - name: Configure
        env:
          CC: ccache clang-18
          CXX: ccache clang++-18
        run: >
          cmake -S. -Bbuild
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVARNISH_PLUS=OFF
          -DPython3_EXECUTABLE=$(which python3)

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Install VMOD
        run: sudo cp build/libvmod_riscv.so $(pkg-config --variable=vmoddir varnishapi)

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4
