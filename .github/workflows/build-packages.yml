name: Packages (Varnish Enterprise)

# Builds native libvmod-riscv packages for every distro/architecture where
# Varnish Enterprise (varnish-plus) is published, in the same naming format as
# the enterprise sledge packages, e.g.
#   libvmod-riscv_1.0~6.0.18r2-1~noble_amd64.deb
#   libvmod-riscv-1.0~6.0.18r2-1.el9.x86_64.rpm
#
# Manual-only: this builds against Varnish Enterprise (varnish-plus) and is not
# meant to run on every push/PR. Trigger it from the Actions tab ("Run
# workflow").
#
# Two independent choices control the run:
#
#   1. Where to get the Varnish Enterprise build packages FROM
#      ("Varnish packages source" + version). Either the public production
#      packagecloud repo (default) or the private staging packagecloud repo
#      (needs the "staging" environment's ENTERPRISE_REPO / PACKAGECLOUD
#      secrets). Building from staging validates a new, not-yet-released
#      Varnish Enterprise version -- set that version in "Custom version
#      override".
#
#   2. What to do with the packages we just built ("Upload packages to
#      staging" checkbox). Unchecked (default) collects the full set of
#      packages into a draft GitHub release for review; checked pushes them
#      up to the staging packagecloud repo instead.
#
# These are now decoupled: e.g. you can build from production and still push
# the result to staging, or build from staging and only produce a draft.
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Git ref (tag, branch or SHA) to build from. Leave empty to build the ref this workflow was triggered on."
        type: string
        default: ""
      varnish_source:
        description: "Varnish packages source: where to get the Varnish Enterprise build packages from"
        type: choice
        default: production
        options:
          - production
          - staging
      vcp_version:
        description: "Varnish Enterprise version"
        type: choice
        default: latest
        options:
          - latest
          - 6.0.18r2
          - 6.0.17r4
          - 6.0.16r13
      vcp_version_custom:
        description: "Custom version override (e.g. 6.0.19r1). Takes precedence over the dropdown when set. The staging source usually needs this, since it targets an unreleased version."
        type: string
        default: ""
      upload_to_staging:
        description: "Upload packages to staging (instead of creating a draft release)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.git_ref }}-${{ inputs.varnish_source }}-${{ inputs.upload_to_staging }}
  cancel-in-progress: true

env:
  # The custom free-text field wins when non-empty, otherwise use the dropdown.
  VCP_VERSION: ${{ inputs.vcp_version_custom != '' && inputs.vcp_version_custom || inputs.vcp_version }}

jobs:
  package:
    name: ${{ matrix.target.label }} (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    container: ${{ matrix.target.image }}
    # When the Varnish source is "staging", attach the "staging" environment so
    # ENTERPRISE_REPO / PACKAGECLOUD_TOKEN resolve to the private staging repo's
    # credentials. For the "production" source no environment is attached and
    # those secrets resolve to empty, so build-package.sh falls back to the
    # public production repo.
    environment: ${{ inputs.varnish_source == 'staging' && 'staging' || '' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
        target:
          # The distro set mirrors upstream varnish/varnish check.yml, narrowed
          # to where varnish-plus / varnish-plus-dev(el) actually ships.
          - { label: ubuntu-jammy,    family: deb, codename: jammy,    image: "ubuntu:22.04" }
          - { label: ubuntu-noble,    family: deb, codename: noble,    image: "ubuntu:24.04" }
          - { label: debian-bookworm, family: deb, codename: bookworm, image: "debian:bookworm" }
          - { label: debian-trixie,   family: deb, codename: trixie,   image: "debian:trixie" }
          - { label: almalinux-8,     family: rpm, dist: el8,          image: "almalinux:8" }
          - { label: almalinux-9,     family: rpm, dist: el9,          image: "almalinux:9" }
          - { label: almalinux-10,    family: rpm, dist: el10,         image: "almalinux:10" }
          - { label: amazonlinux-2023, family: rpm, dist: amzn2023,    image: "amazonlinux:2023" }
        exclude:
          # varnish-plus / varnish-plus-devel is not published for el8 on
          # aarch64 (only amd64), so the arm64 alma-8 build cannot resolve its
          # build dependencies. amd64 alma-8 still builds.
          - { arch: { name: arm64, runner: ubuntu-24.04-arm }, target: { label: almalinux-8, family: rpm, dist: el8, image: "almalinux:8" } }
    steps:
      # actions/checkout (and submodule fetch) needs git + certs present in the
      # bare distro images before it can run.
      - name: Install checkout prerequisites
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
          else
            (command -v dnf >/dev/null 2>&1 && dnf install -y git ca-certificates) \
              || yum install -y git ca-certificates
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          submodules: recursive

      - name: Build package
        env:
          PKG_FAMILY: ${{ matrix.target.family }}
          PKG_CODENAME: ${{ matrix.target.codename }}
          PKG_DIST: ${{ matrix.target.dist }}
          VCP_VERSION: ${{ env.VCP_VERSION }}
          # Empty in prod (no environment attached) -> public production repo.
          ENTERPRISE_REPO: ${{ secrets.ENTERPRISE_REPO }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          OUTDIR: ${{ github.workspace }}/packages
        run: packaging/ci/build-package.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: libvmod-riscv-${{ matrix.target.label }}-${{ matrix.arch.name }}
          path: packages/*
          if-no-files-found: error

  # DEFAULT: collect every distro/arch artifact into a single draft GitHub
  # release so the full set of .deb/.rpm packages can be reviewed and published
  # in one place. Runs unless "Upload packages to staging" is checked.
  release:
    name: Draft release
    if: ${{ !inputs.upload_to_staging }}
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Check out the same ref we built from so the release can be targeted at
      # the exact commit (gh release --target needs a branch or full SHA).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve target commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libvmod-riscv-*
          merge-multiple: true

      - name: List collected packages
        run: ls -l artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: packages-build-${{ github.run_number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "libvmod-riscv packages (build ${{ github.run_number }}, VE ${{ env.VCP_VERSION }})" \
            --target "$TARGET_SHA" \
            --notes "Draft release with native libvmod-riscv packages for all supported Varnish Enterprise distros/architectures, built against Varnish Enterprise \`${{ env.VCP_VERSION }}\` from ${TARGET_SHA}." \
            artifacts/*

  # OPT-IN: push the freshly built packages up to the staging Varnish Enterprise
  # packagecloud repo, so the new (unreleased) version can be installed from
  # staging for validation. Runs only when "Upload packages to staging" is
  # checked.
  upload:
    name: Upload to staging
    if: ${{ inputs.upload_to_staging }}
    needs: package
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: libvmod-riscv-*

      - name: Push packages to staging packagecloud
        env:
          # ENTERPRISE_REPO doubles as the push target (the staging repo we
          # installed from). PACKAGECLOUD_TOKEN must have push access.
          STAGING_REPO: ${{ secrets.ENTERPRISE_REPO }}
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
        run: packaging/ci/upload-staging.sh
